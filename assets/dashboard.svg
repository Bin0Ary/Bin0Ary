<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Bin0Ary monitoring dashboard</title>
  <desc id="desc">A futuristic HUD panel with rounded glass cards, system status, graphs, terminal prompt, radar, waveform, and small indicator lights.</desc>

  <defs>
    <!-- Core palette -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#101720"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#11161E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#7EE787"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 H 0 V 28" fill="none" stroke="#30363D" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feFlood flood-color="#58A6FF" flood-opacity="0.5" result="f"/>
      <feComposite in="f" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="topClip">
      <rect x="32" y="28" width="1216" height="364" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)" opacity="0.55"/>
  <rect x="26" y="18" width="1228" height="384" rx="28" fill="none" stroke="url(#stroke)"/>
  <rect x="32" y="28" width="1216" height="364" rx="26" fill="url(#glass)" stroke="#30363D"/>
  <rect x="32" y="28" width="1216" height="364" rx="26" fill="url(#orb)"/>

  <!-- Ambient sweep -->
  <circle cx="1060" cy="112" r="120" fill="#58A6FF" fill-opacity="0.05" filter="url(#soft)">
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="8s" repeatCount="indefinite"/>
  </circle>

  <g clip-path="url(#topClip)">
    <!-- Left status stack -->
    <g transform="translate(56 54)">
      <text x="0" y="0" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="13" letter-spacing="2">SYSTEM STATUS</text>
      <text x="0" y="40" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="33" font-weight="700" letter-spacing="1.3" filter="url(#glow)">ONLINE</text>
      <rect x="0" y="54" width="120" height="3" rx="2" fill="url(#accent)" fill-opacity="0.38"/>

      <g transform="translate(0 82)">
        <text x="0" y="0" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="12" letter-spacing="1.8">ROLE</text>
        <text x="0" y="26" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="18">Backend Developer</text>
      </g>

      <g transform="translate(0 136)">
        <text x="0" y="0" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="12" letter-spacing="1.8">EDUCATION</text>
        <text x="0" y="26" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="18">Computer Engineering Student</text>
      </g>

      <g transform="translate(0 190)">
        <text x="0" y="0" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="12" letter-spacing="1.8">STACK</text>
        <g transform="translate(0 14)">
          <g transform="translate(0 14)">
            <rect x="0" y="0" width="52" height="28" rx="14" fill="#0F141C" stroke="#30363D"/>
            <text x="26" y="19" text-anchor="middle" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="13">C#</text>
          </g>
          <g transform="translate(60 14)">
            <rect x="0" y="0" width="102" height="28" rx="14" fill="#0F141C" stroke="#30363D"/>
            <text x="51" y="19" text-anchor="middle" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="13">ASP.NET Core</text>
          </g>
          <g transform="translate(170 14)">
            <rect x="0" y="0" width="92" height="28" rx="14" fill="#0F141C" stroke="#30363D"/>
            <text x="46" y="19" text-anchor="middle" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="13">PostgreSQL</text>
          </g>
          <g transform="translate(270 14)">
            <rect x="0" y="0" width="66" height="28" rx="14" fill="#0F141C" stroke="#30363D"/>
            <text x="33" y="19" text-anchor="middle" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="13">Docker</text>
          </g>
          <g transform="translate(344 14)">
            <rect x="0" y="0" width="56" height="28" rx="14" fill="#0F141C" stroke="#30363D"/>
            <text x="28" y="19" text-anchor="middle" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="13">Linux</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Middle terminal / prompt card -->
    <g transform="translate(522 56)">
      <rect x="0" y="0" width="338" height="292" rx="22" fill="#0D1117" fill-opacity="0.58" stroke="#30363D"/>
      <rect x="16" y="16" width="306" height="3" rx="2" fill="url(#accent)" fill-opacity="0.28"/>
      <text x="18" y="46" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="12" letter-spacing="1.6">TERMINAL</text>
      <text x="18" y="80" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="16">&gt; build scalable backend systems</text>
      <text x="18" y="108" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="14">&gt; optimize APIs • automate pipelines</text>
      <text x="18" y="130" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="14">&gt; ship clean contracts</text>

      <g transform="translate(18 156)">
        <text x="0" y="0" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="12" letter-spacing="1.6">CURRENT FOCUS</text>
        <text x="0" y="24" fill="#F0F6FC" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="15">Building reliable systems</text>
      </g>

      <g transform="translate(18 196)">
        <rect x="0" y="0" width="244" height="11" rx="6" fill="#161B22" stroke="#30363D"/>
        <rect x="0" y="0" width="178" height="11" rx="6" fill="url(#green)">
          <animate attributeName="width" values="156;194;168;182;156" dur="6.4s" repeatCount="indefinite"/>
        </rect>
        <text x="258" y="10" fill="#79C0FF" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="12">84%</text>
      </g>

      <g transform="translate(18 222)">
        <rect x="0" y="0" width="244" height="11" rx="6" fill="#161B22" stroke="#30363D"/>
        <rect x="0" y="0" width="148" height="11" rx="6" fill="url(#accent)">
          <animate attributeName="width" values="140;166;150;158;140" dur="7.2s" repeatCount="indefinite"/>
        </rect>
        <text x="258" y="10" fill="#79C0FF" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="12">67%</text>
      </g>

      <g transform="translate(18 248)">
        <rect x="0" y="0" width="244" height="11" rx="6" fill="#161B22" stroke="#30363D"/>
        <rect x="0" y="0" width="214" height="11" rx="6" fill="url(#green)">
          <animate attributeName="width" values="198;224;210;218;198" dur="7.8s" repeatCount="indefinite"/>
        </rect>
        <text x="258" y="10" fill="#79C0FF" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="12">93%</text>
      </g>

      <text x="18" y="282" fill="#3FB950" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="14">$</text>
      <rect x="31" y="268" width="9" height="18" rx="2" fill="#F0F6FC" opacity="0.85">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Right analytics cluster -->
    <g transform="translate(888 48)">
      <rect x="0" y="0" width="324" height="284" rx="22" fill="#0D1117" fill-opacity="0.48" stroke="#30363D"/>
      <rect x="18" y="18" width="288" height="248" rx="18" fill="none" stroke="#30363D"/>

      <!-- Indicator row -->
      <g transform="translate(20 22)">
        <circle cx="0" cy="0" r="5" fill="#3FB950" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/></circle>
        <circle cx="20" cy="0" r="5" fill="#58A6FF" filter="url(#glow)"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" repeatCount="indefinite"/></circle>
        <circle cx="40" cy="0" r="5" fill="#79C0FF" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.8s" repeatCount="indefinite"/></circle>
        <circle cx="60" cy="0" r="5" fill="#8B949E">
          <animate attributeName="opacity" values="0.22;0.7;0.22" dur="4.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- CPU graph -->
      <g transform="translate(24 46)">
        <text x="0" y="0" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="11" letter-spacing="1.4">CPU GRAPH</text>
        <rect x="0" y="12" width="264" height="58" rx="12" fill="#161B22" stroke="#30363D"/>
        <path d="M8 56 C30 52, 40 22, 60 34 S92 66, 112 40 S152 16, 172 28 S214 58, 256 22" fill="none" stroke="#58A6FF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 56 C30 52, 40 22, 60 34 S92 66, 112 40 S152 16, 172 28 S214 58, 256 22 L256 70 L8 70 Z" fill="#58A6FF" fill-opacity="0.08"/>
        <animate attributeName="opacity" values="0.9;1;0.9" dur="5s" repeatCount="indefinite"/>
      </g>

      <!-- Memory graph -->
      <g transform="translate(24 118)">
        <text x="0" y="0" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="11" letter-spacing="1.4">MEMORY GRAPH</text>
        <rect x="0" y="12" width="264" height="58" rx="12" fill="#161B22" stroke="#30363D"/>
        <path d="M8 54 L34 54 L52 46 L72 46 L90 36 L114 36 L136 40 L162 32 L190 32 L216 26 L256 26" fill="none" stroke="#3FB950" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 54 L34 54 L52 46 L72 46 L90 36 L114 36 L136 40 L162 32 L190 32 L216 26 L256 26 L256 70 L8 70 Z" fill="#3FB950" fill-opacity="0.08"/>
      </g>

      <!-- Network / waveform -->
      <g transform="translate(24 190)">
        <text x="0" y="0" fill="#8B949E" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="11" letter-spacing="1.4">NETWORK</text>
        <rect x="0" y="12" width="264" height="58" rx="12" fill="#161B22" stroke="#30363D"/>
        <path d="M8 42 C22 18, 42 18, 58 42 S94 66, 110 42 S146 18, 162 42 S198 66, 214 42 S238 18, 256 42" fill="none" stroke="#79C0FF" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M8 42 C22 18, 42 18, 58 42 S94 66, 110 42 S146 18, 162 42 S198 66, 214 42 S238 18, 256 42 L256 70 L8 70 Z" fill="#79C0FF" fill-opacity="0.07"/>
        <circle cx="214" cy="42" r="3.3" fill="#F0F6FC" fill-opacity="0.85">
          <animate attributeName="opacity" values="0.1;0.95;0.1" dur="1.4s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
