<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 180" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Ambient particle field</title>
  <desc id="desc">A subtle field of floating nodes, circuit traces, and radar arcs for use as a footer or section divider.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111823"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#30363D" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#79C0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#79C0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#58A6FF" flood-opacity="0.45" result="f"/>
      <feComposite in="f" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#30363D" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="180" fill="url(#bg)"/>
  <rect width="1280" height="180" fill="url(#grid)" opacity="0.9"/>

  <!-- Soft horizon line -->
  <rect x="36" y="92" width="1208" height="1.5" fill="url(#line)"/>

  <!-- Radars and pulses -->
  <g transform="translate(196 92)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#79C0FF" stroke-opacity="0.18"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#79C0FF" stroke-opacity="0.08" stroke-dasharray="4 6"/>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#79C0FF" stroke-opacity="0.6" stroke-width="1.4">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="11s" repeatCount="indefinite"/>
    </line>
  </g>

  <g transform="translate(1036 84)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#3FB950" stroke-opacity="0.16"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#3FB950" stroke-opacity="0.08"/>
    <circle cx="0" cy="0" r="4" fill="url(#pulse)" filter="url(#glow)">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating particle field -->
  <g>
    <circle cx="90" cy="52" r="2.1" fill="url(#spark)">
      <animate attributeName="cy" values="52;34;52" dur="8.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.95;0.3" dur="8.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="126" r="1.9" fill="url(#spark)">
      <animate attributeName="cy" values="126;110;126" dur="7.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="52" r="1.8" fill="url(#spark)">
      <animate attributeName="cy" values="52;68;52" dur="9.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="118" r="2.3" fill="url(#spark)">
      <animate attributeName="cy" values="118;96;118" dur="8.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="562" cy="74" r="2" fill="url(#spark)">
      <animate attributeName="cy" values="74;52;74" dur="10.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="698" cy="140" r="1.9" fill="url(#spark)">
      <animate attributeName="cy" values="140;122;140" dur="6.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="828" cy="46" r="2.4" fill="url(#spark)">
      <animate attributeName="cy" values="46;62;46" dur="8.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="932" cy="122" r="1.8" fill="url(#spark)">
      <animate attributeName="cy" values="122;100;122" dur="9.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1108" cy="58" r="2.1" fill="url(#spark)">
      <animate attributeName="cy" values="58;42;58" dur="7.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1202" cy="132" r="1.9" fill="url(#spark)">
      <animate attributeName="cy" values="132;114;132" dur="8.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Thin data traces -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 104 H150 V78 H214" stroke="#58A6FF" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M252 110 H338 V128 H418" stroke="#79C0FF" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M510 96 H612 V72 H718" stroke="#58A6FF" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M770 112 H870 V90 H952" stroke="#3FB950" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M1010 94 H1092 V118 H1210" stroke="#79C0FF" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- Binary tick marks -->
  <g fill="#8B949E" fill-opacity="0.34" font-family="JetBrains Mono, Segoe UI Mono, Consolas, monospace" font-size="11" letter-spacing="1.2">
    <text x="66" y="28">01</text>
    <text x="350" y="156">10</text>
    <text x="656" y="32">11</text>
    <text x="960" y="154">00</text>
    <text x="1190" y="30">01</text>
  </g>
</svg>
